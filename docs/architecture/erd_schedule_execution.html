
<style>
#e2{overflow-x:auto}
#e2 svg{max-width:100%}
#e2 svg.erDiagram .divider path{stroke-opacity:.4}
#e2 svg.erDiagram .row-rect-odd path,
#e2 svg.erDiagram .row-rect-odd rect,
#e2 svg.erDiagram .row-rect-even path,
#e2 svg.erDiagram .row-rect-even rect{stroke:none!important}
</style>
<div id="e2"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({startOnLoad:false,theme:'base',fontFamily:'"Anthropic Sans",sans-serif',
  themeVariables:{darkMode:dark,fontSize:'13px',fontFamily:'"Anthropic Sans",sans-serif',
    lineColor:dark?'#9c9a92':'#73726c',textColor:dark?'#c2c0b6':'#3d3d3a',
    primaryColor:dark?'#063d2e':'#E1F5EE',primaryBorderColor:dark?'#1D9E75':'#0F6E56',
    primaryTextColor:dark?'#9FE1CB':'#085041',
    secondaryColor:dark?'#2a2870':'#EEEDFE',tertiaryColor:dark?'#1a1a18':'#F1EFE8'}});
const src=`erDiagram
  dag_definition {
    bigint id PK
    bigint project_id FK
    string name
    text dag_json
    string status
    bigint created_by FK
    timestamp created_at
  }
  dag_task {
    bigint id PK
    bigint dag_id FK
    string task_ref_type
    bigint task_ref_id
    string upstream_task_ids
    int timeout_s
    int retry_max
    int retry_interval_s
    string backfill_strategy
  }
  dag_run {
    bigint id PK
    bigint dag_id FK
    string trigger_type
    string trigger_params
    string status
    timestamp started_at
    timestamp finished_at
  }
  dag_task_run {
    bigint id PK
    bigint dag_run_id FK
    bigint dag_task_id FK
    bigint exec_record_id FK
    string status
    int attempt_no
    timestamp started_at
    timestamp finished_at
  }
  exec_record {
    bigint id PK
    string task_ref_type
    bigint task_ref_id
    bigint task_ref_version_id
    bigint dag_task_run_id FK
    string trigger_type
    string engine
    string status
    text params_json
    text result_summary
    bigint rows_read
    bigint rows_written
    bigint scan_bytes
    int duration_ms
    bigint executed_by FK
    timestamp started_at
    timestamp finished_at
  }
  schedule_job {
    bigint id PK
    string job_ref_type
    bigint job_ref_id
    string cron_expr
    string timezone
    boolean enabled
    int retry_max
    int retry_interval_s
    string backfill_strategy
    timestamp next_run_at
    bigint created_by FK
  }
  dag_definition ||--o{ dag_task : contains
  dag_definition ||--o{ dag_run : instantiates
  dag_run ||--o{ dag_task_run : decomposes
  dag_task_run ||--|| exec_record : produces
  schedule_job ||--o{ exec_record : triggers
`;
const {svg}=await mermaid.render('e2svg',src);
document.getElementById('e2').innerHTML=svg;
document.querySelectorAll('#e2 svg.erDiagram .node').forEach(n=>{
  const p=n.querySelector('path[d]');if(!p)return;
  const d=p.getAttribute('d'),nums=d.match(/-?[\d.]+/g)?.map(Number);
  if(!nums||nums.length<8)return;
  const xs=[nums[0],nums[2],nums[4],nums[6]],ys=[nums[1],nums[3],nums[5],nums[7]];
  const x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;
  const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
  r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);r.setAttribute('rx','8');
  for(const a of['fill','stroke','stroke-width','class','style'])if(p.hasAttribute(a))r.setAttribute(a,p.getAttribute(a));
  p.replaceWith(r);
});
document.querySelectorAll('#e2 svg.erDiagram .row-rect-odd path,#e2 svg.erDiagram .row-rect-even path').forEach(p=>p.setAttribute('stroke','none'));
</script>
