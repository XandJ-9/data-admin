<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据开发模块架构图</title>
<style>
  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f5f4ef;
    --color-background-tertiary: #eceae2;
    --color-text-primary: #1a1a18;
    --color-text-secondary: #5f5e5a;
    --color-text-tertiary: #888780;
    --color-border-tertiary: rgba(0,0,0,0.12);
    --color-border-secondary: rgba(0,0,0,0.25);
    --font-sans: system-ui, -apple-system, sans-serif;
    --border-radius-md: 8px;
    --border-radius-lg: 12px;
    --p: #534AB7; --s: #1D9E75; --t: rgba(0,0,0,0.5);
    --bg2: #f5f4ef; --b: rgba(0,0,0,0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-background-primary: #1c1c1a;
      --color-background-secondary: #252522;
      --color-background-tertiary: #2c2c2a;
      --color-text-primary: #e8e6dc;
      --color-text-secondary: #9c9a92;
      --color-text-tertiary: #6b6964;
      --color-border-tertiary: rgba(255,255,255,0.1);
      --color-border-secondary: rgba(255,255,255,0.2);
      --t: rgba(255,255,255,0.5);
      --bg2: #252522; --b: rgba(255,255,255,0.12);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--color-background-tertiary);
    color: var(--color-text-primary);
    padding: 2rem;
    min-height: 100vh;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    color: var(--color-text-primary);
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .card {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1.5rem;
    max-width: 800px;
    margin: 0 auto;
  }

  /* SVG pre-built classes */
  svg text.t  { font-family: var(--font-sans); font-size: 14px; font-weight: 400; fill: var(--color-text-primary); }
  svg text.ts { font-family: var(--font-sans); font-size: 12px; font-weight: 400; fill: var(--color-text-secondary); }
  svg text.th { font-family: var(--font-sans); font-size: 14px; font-weight: 500; fill: var(--color-text-primary); }

  svg .box  { fill: var(--bg2); stroke: var(--b); }
  svg .arr  { fill: none; stroke: var(--t); stroke-width: 1.5; }
  svg .leader { fill: none; stroke: var(--t); stroke-width: 0.5; stroke-dasharray: 4 3; }

  svg .node { cursor: pointer; }
  svg .node:hover { opacity: 0.8; }

  /* Color ramps — light */
  svg .c-purple > rect, svg .c-purple > circle, svg .c-purple > ellipse { fill: #EEEDFE; stroke: #534AB7; }
  svg .c-purple > text.th { fill: #3C3489; }
  svg .c-purple > text.ts { fill: #534AB7; }

  svg .c-teal > rect, svg .c-teal > circle, svg .c-teal > ellipse { fill: #E1F5EE; stroke: #0F6E56; }
  svg .c-teal > text.th { fill: #085041; }
  svg .c-teal > text.ts { fill: #0F6E56; }

  svg .c-coral > rect, svg .c-coral > circle, svg .c-coral > ellipse { fill: #FAECE7; stroke: #993C1D; }
  svg .c-coral > text.th { fill: #712B13; }
  svg .c-coral > text.ts { fill: #993C1D; }

  svg .c-blue > rect, svg .c-blue > circle, svg .c-blue > ellipse { fill: #E6F1FB; stroke: #185FA5; }
  svg .c-blue > text.th { fill: #0C447C; }
  svg .c-blue > text.ts { fill: #185FA5; }

  svg .c-amber > rect, svg .c-amber > circle, svg .c-amber > ellipse { fill: #FAEEDA; stroke: #854F0B; }
  svg .c-amber > text.th { fill: #633806; }
  svg .c-amber > text.ts { fill: #854F0B; }

  svg .c-gray > rect, svg .c-gray > circle, svg .c-gray > ellipse { fill: #F1EFE8; stroke: #5F5E5A; }
  svg .c-gray > text.th { fill: #444441; }
  svg .c-gray > text.ts { fill: #5F5E5A; }

  /* Dark mode ramps */
  @media (prefers-color-scheme: dark) {
    svg .c-purple > rect, svg .c-purple > circle, svg .c-purple > ellipse { fill: #3C3489; stroke: #AFA9EC; }
    svg .c-purple > text.th { fill: #CECBF6; }
    svg .c-purple > text.ts { fill: #AFA9EC; }

    svg .c-teal > rect, svg .c-teal > circle, svg .c-teal > ellipse { fill: #085041; stroke: #5DCAA5; }
    svg .c-teal > text.th { fill: #9FE1CB; }
    svg .c-teal > text.ts { fill: #5DCAA5; }

    svg .c-coral > rect, svg .c-coral > circle, svg .c-coral > ellipse { fill: #712B13; stroke: #F0997B; }
    svg .c-coral > text.th { fill: #F5C4B3; }
    svg .c-coral > text.ts { fill: #F0997B; }

    svg .c-blue > rect, svg .c-blue > circle, svg .c-blue > ellipse { fill: #0C447C; stroke: #85B7EB; }
    svg .c-blue > text.th { fill: #B5D4F4; }
    svg .c-blue > text.ts { fill: #85B7EB; }

    svg .c-amber > rect, svg .c-amber > circle, svg .c-amber > ellipse { fill: #633806; stroke: #EF9F27; }
    svg .c-amber > text.th { fill: #FAC775; }
    svg .c-amber > text.ts { fill: #EF9F27; }

    svg .c-gray > rect, svg .c-gray > circle, svg .c-gray > ellipse { fill: #444441; stroke: #B4B2A9; }
    svg .c-gray > text.th { fill: #D3D1C7; }
    svg .c-gray > text.ts { fill: #B4B2A9; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>数据开发模块架构图</h1>
<svg width="100%" viewBox="0 0 680 860" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- 用户接入层 -->
<rect x="30" y="20" width="620" height="52" rx="10" fill="none" stroke="var(--color-border-secondary)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="44" y="36" fill="var(--color-text-tertiary)">用户接入层</text>
<g class="node c-gray">
  <rect x="50" y="42" width="130" height="22" rx="5" stroke-width="0.5"/>
  <text class="ts" x="115" y="53" text-anchor="middle" dominant-baseline="central">Web SQL 编辑器</text>
</g>
<g class="node c-gray">
  <rect x="195" y="42" width="140" height="22" rx="5" stroke-width="0.5"/>
  <text class="ts" x="265" y="53" text-anchor="middle" dominant-baseline="central">Python / PySpark IDE</text>
</g>
<g class="node c-gray">
  <rect x="350" y="42" width="140" height="22" rx="5" stroke-width="0.5"/>
  <text class="ts" x="420" y="53" text-anchor="middle" dominant-baseline="central">低代码 / 拖拽画布</text>
</g>
<g class="node c-gray">
  <rect x="505" y="42" width="130" height="22" rx="5" stroke-width="0.5"/>
  <text class="ts" x="570" y="53" text-anchor="middle" dominant-baseline="central">元数据浏览器</text>
</g>

<line x1="340" y1="72" x2="340" y2="96" class="arr" marker-end="url(#arrow)" stroke="var(--color-border-secondary)"/>

<!-- 多模式 IDE 核心 -->
<g class="c-purple">
  <rect x="30" y="96" width="620" height="100" rx="10" stroke-width="0.5"/>
  <text class="th" x="50" y="117" dominant-baseline="central">多模式 IDE 核心</text>
</g>
<g class="node c-purple">
  <rect x="50" y="125" width="168" height="56" rx="7" stroke-width="0.5"/>
  <text class="th" x="134" y="146" text-anchor="middle" dominant-baseline="central">SQL 编辑器</text>
  <text class="ts" x="134" y="164" text-anchor="middle" dominant-baseline="central">语法高亮 · 自动补全 · 执行计划</text>
</g>
<g class="node c-purple">
  <rect x="236" y="125" width="168" height="56" rx="7" stroke-width="0.5"/>
  <text class="th" x="320" y="146" text-anchor="middle" dominant-baseline="central">Notebook 内核</text>
  <text class="ts" x="320" y="164" text-anchor="middle" dominant-baseline="central">PySpark · 远程内核 · 实时输出</text>
</g>
<g class="node c-purple">
  <rect x="422" y="125" width="210" height="56" rx="7" stroke-width="0.5"/>
  <text class="th" x="527" y="146" text-anchor="middle" dominant-baseline="central">低代码画布引擎</text>
  <text class="ts" x="527" y="164" text-anchor="middle" dominant-baseline="central">拖拽组件 · 自动生成 DAG/代码</text>
</g>

<line x1="240" y1="196" x2="240" y2="220" class="arr" marker-end="url(#arrow)" stroke="var(--color-border-secondary)"/>
<line x1="440" y1="196" x2="440" y2="220" class="arr" marker-end="url(#arrow)" stroke="var(--color-border-secondary)"/>

<!-- GitOps -->
<g class="c-teal">
  <rect x="30" y="220" width="290" height="130" rx="10" stroke-width="0.5"/>
  <text class="th" x="50" y="241" dominant-baseline="central">版本管理 (GitOps)</text>
</g>
<g class="node c-teal">
  <rect x="48" y="252" width="122" height="44" rx="7" stroke-width="0.5"/>
  <text class="th" x="109" y="267" text-anchor="middle" dominant-baseline="central">Git 提交</text>
  <text class="ts" x="109" y="283" text-anchor="middle" dominant-baseline="central">分支 · PR · 版本锁</text>
</g>
<g class="node c-teal">
  <rect x="188" y="252" width="122" height="44" rx="7" stroke-width="0.5"/>
  <text class="th" x="249" y="267" text-anchor="middle" dominant-baseline="central">CI/CD 流水线</text>
  <text class="ts" x="249" y="283" text-anchor="middle" dominant-baseline="central">测试 → 预发 → 生产</text>
</g>
<line x1="170" y1="274" x2="186" y2="274" class="arr" marker-end="url(#arrow)" stroke="var(--color-border-secondary)"/>
<text class="ts" x="48" y="318" fill="var(--color-text-secondary)">代码提交即触发，测试通过后发布</text>

<!-- 调度引擎 -->
<g class="c-teal">
  <rect x="360" y="220" width="290" height="130" rx="10" stroke-width="0.5"/>
  <text class="th" x="380" y="241" dominant-baseline="central">调度引擎 (Orchestration)</text>
</g>
<g class="node c-teal">
  <rect x="378" y="252" width="122" height="44" rx="7" stroke-width="0.5"/>
  <text class="th" x="439" y="267" text-anchor="middle" dominant-baseline="central">DAG 编排</text>
  <text class="ts" x="439" y="283" text-anchor="middle" dominant-baseline="central">依赖图 · 并行 · 分支</text>
</g>
<g class="node c-teal">
  <rect x="518" y="252" width="122" height="44" rx="7" stroke-width="0.5"/>
  <text class="th" x="579" y="267" text-anchor="middle" dominant-baseline="central">执行控制</text>
  <text class="ts" x="579" y="283" text-anchor="middle" dominant-baseline="central">补数 · 重试 · 告警</text>
</g>
<line x1="500" y1="274" x2="516" y2="274" class="arr" marker-end="url(#arrow)" stroke="var(--color-border-secondary)"/>
<text class="ts" x="378" y="318" fill="var(--color-text-secondary)">类 Airflow / DolphinScheduler 架构</text>

<line x1="175" y1="350" x2="175" y2="374" class="arr" marker-end="url(#arrow)" stroke="var(--color-border-secondary)"/>
<line x1="505" y1="350" x2="505" y2="374" class="arr" marker-end="url(#arrow)" stroke="var(--color-border-secondary)"/>

<!-- 统一元数据层 -->
<g class="c-coral">
  <rect x="30" y="374" width="290" height="118" rx="10" stroke-width="0.5"/>
  <text class="th" x="50" y="395" dominant-baseline="central">统一元数据层</text>
</g>
<g class="node c-coral">
  <rect x="48" y="406" width="115" height="72" rx="7" stroke-width="0.5"/>
  <text class="th" x="105" y="425" text-anchor="middle" dominant-baseline="central">数据目录</text>
  <text class="ts" x="105" y="443" text-anchor="middle" dominant-baseline="central">表 · 字段 · 分区</text>
  <text class="ts" x="105" y="460" text-anchor="middle" dominant-baseline="central">血缘 · 标签</text>
</g>
<g class="node c-coral">
  <rect x="179" y="406" width="130" height="72" rx="7" stroke-width="0.5"/>
  <text class="th" x="244" y="425" text-anchor="middle" dominant-baseline="central">Schema 注册</text>
  <text class="ts" x="244" y="443" text-anchor="middle" dominant-baseline="central">Avro · Protobuf</text>
  <text class="ts" x="244" y="460" text-anchor="middle" dominant-baseline="central">版本演化兼容</text>
</g>

<!-- 计算与执行层 -->
<g class="c-coral">
  <rect x="360" y="374" width="290" height="118" rx="10" stroke-width="0.5"/>
  <text class="th" x="380" y="395" dominant-baseline="central">计算与执行层</text>
</g>
<g class="node c-coral">
  <rect x="378" y="406" width="115" height="72" rx="7" stroke-width="0.5"/>
  <text class="th" x="435" y="425" text-anchor="middle" dominant-baseline="central">资源调度</text>
  <text class="ts" x="435" y="443" text-anchor="middle" dominant-baseline="central">K8s · YARN</text>
  <text class="ts" x="435" y="460" text-anchor="middle" dominant-baseline="central">弹性伸缩</text>
</g>
<g class="node c-coral">
  <rect x="511" y="406" width="130" height="72" rx="7" stroke-width="0.5"/>
  <text class="th" x="576" y="425" text-anchor="middle" dominant-baseline="central">多引擎路由</text>
  <text class="ts" x="576" y="443" text-anchor="middle" dominant-baseline="central">Spark · Flink · Trino</text>
  <text class="ts" x="576" y="460" text-anchor="middle" dominant-baseline="central">Hive · StarRocks</text>
</g>

<line x1="340" y1="492" x2="340" y2="516" class="arr" marker-end="url(#arrow)" stroke="var(--color-border-secondary)"/>

<!-- 湖仓一体存储层 -->
<g class="c-blue">
  <rect x="30" y="516" width="620" height="130" rx="10" stroke-width="0.5"/>
  <text class="th" x="50" y="537" dominant-baseline="central">湖仓一体存储层</text>
</g>
<g class="node c-blue">
  <rect x="48" y="548" width="130" height="84" rx="7" stroke-width="0.5"/>
  <text class="th" x="113" y="570" text-anchor="middle" dominant-baseline="central">Apache Iceberg</text>
  <text class="ts" x="113" y="588" text-anchor="middle" dominant-baseline="central">ACID · 时间旅行</text>
  <text class="ts" x="113" y="605" text-anchor="middle" dominant-baseline="central">Schema 演化</text>
</g>
<g class="node c-blue">
  <rect x="196" y="548" width="130" height="84" rx="7" stroke-width="0.5"/>
  <text class="th" x="261" y="570" text-anchor="middle" dominant-baseline="central">Apache Hudi</text>
  <text class="ts" x="261" y="588" text-anchor="middle" dominant-baseline="central">增量更新 · CDC</text>
  <text class="ts" x="261" y="605" text-anchor="middle" dominant-baseline="central">CoW / MoR</text>
</g>
<g class="node c-blue">
  <rect x="344" y="548" width="130" height="84" rx="7" stroke-width="0.5"/>
  <text class="th" x="409" y="570" text-anchor="middle" dominant-baseline="central">对象存储</text>
  <text class="ts" x="409" y="588" text-anchor="middle" dominant-baseline="central">S3 · OSS · GCS</text>
  <text class="ts" x="409" y="605" text-anchor="middle" dominant-baseline="central">HDFS 兼容</text>
</g>
<g class="node c-blue">
  <rect x="492" y="548" width="140" height="84" rx="7" stroke-width="0.5"/>
  <text class="th" x="562" y="570" text-anchor="middle" dominant-baseline="central">统一存储 API</text>
  <text class="ts" x="562" y="588" text-anchor="middle" dominant-baseline="central">屏蔽底层差异</text>
  <text class="ts" x="562" y="605" text-anchor="middle" dominant-baseline="central">Catalog 联邦</text>
</g>

<line x1="340" y1="646" x2="340" y2="670" class="arr" marker-end="url(#arrow)" stroke="var(--color-border-secondary)"/>

<!-- 横切关注点 -->
<rect x="30" y="670" width="620" height="68" rx="10" fill="none" stroke="var(--color-border-secondary)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="44" y="686" fill="var(--color-text-tertiary)">横切关注点</text>
<g class="node c-amber">
  <rect x="48" y="694" width="138" height="34" rx="6" stroke-width="0.5"/>
  <text class="th" x="117" y="711" text-anchor="middle" dominant-baseline="central">数据质量 &amp; 血缘</text>
</g>
<g class="node c-amber">
  <rect x="202" y="694" width="122" height="34" rx="6" stroke-width="0.5"/>
  <text class="th" x="263" y="711" text-anchor="middle" dominant-baseline="central">权限 &amp; 安全</text>
</g>
<g class="node c-amber">
  <rect x="340" y="694" width="138" height="34" rx="6" stroke-width="0.5"/>
  <text class="th" x="409" y="711" text-anchor="middle" dominant-baseline="central">监控 &amp; 可观测性</text>
</g>
<g class="node c-amber">
  <rect x="494" y="694" width="138" height="34" rx="6" stroke-width="0.5"/>
  <text class="th" x="563" y="711" text-anchor="middle" dominant-baseline="central">成本治理 &amp; 配额</text>
</g>

<!-- 图例 -->
<rect x="30" y="756" width="620" height="84" rx="8" fill="none" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="50" y="773" fill="var(--color-text-tertiary)">图例</text>
<rect x="50" y="784" width="14" height="10" rx="3" class="c-purple" stroke-width="0.5"/>
<text class="ts" x="70" y="793">IDE 核心</text>
<rect x="145" y="784" width="14" height="10" rx="3" class="c-teal" stroke-width="0.5"/>
<text class="ts" x="165" y="793">GitOps / 调度</text>
<rect x="265" y="784" width="14" height="10" rx="3" class="c-coral" stroke-width="0.5"/>
<text class="ts" x="285" y="793">元数据 / 计算</text>
<rect x="385" y="784" width="14" height="10" rx="3" class="c-blue" stroke-width="0.5"/>

<rect x="480" y="784" width="14" height="10" rx="3" class="c-amber" stroke-width="0.5"/>
<text class="ts" x="500" y="793">横切关注点</text>
<text class="ts" x="50" y="826" fill="var(--color-text-tertiary)">数据流向: 用户接入 → 多模式 IDE → GitOps &amp; 调度 → 元数据 &amp; 计算 → 湖仓存储</text>
</svg>
</div>
</body>
</html>
