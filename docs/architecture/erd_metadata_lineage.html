
<style>
#e3{overflow-x:auto}
#e3 svg{max-width:100%}
#e3 svg.erDiagram .divider path{stroke-opacity:.4}
#e3 svg.erDiagram .row-rect-odd path,
#e3 svg.erDiagram .row-rect-odd rect,
#e3 svg.erDiagram .row-rect-even path,
#e3 svg.erDiagram .row-rect-even rect{stroke:none!important}
</style>
<div id="e3"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({startOnLoad:false,theme:'base',fontFamily:'"Anthropic Sans",sans-serif',
  themeVariables:{darkMode:dark,fontSize:'13px',fontFamily:'"Anthropic Sans",sans-serif',
    lineColor:dark?'#9c9a92':'#73726c',textColor:dark?'#c2c0b6':'#3d3d3a',
    primaryColor:dark?'#3d1a0a':'#FAECE7',primaryBorderColor:dark?'#993C1D':'#993C1D',
    primaryTextColor:dark?'#F5C4B3':'#712B13',
    secondaryColor:dark?'#063d2e':'#E1F5EE',tertiaryColor:dark?'#1a1a18':'#F1EFE8'}});
const src=`erDiagram
  catalog_table {
    bigint id PK
    bigint datasource_id FK
    string db_name
    string schema_name
    string table_name
    string table_type
    string data_layer
    string description
    bigint owner_id FK
    bigint row_count
    bigint size_bytes
    timestamp last_sync_at
    timestamp last_modified_at
  }
  catalog_field {
    bigint id PK
    bigint table_id FK
    string field_name
    string field_type
    int ordinal_position
    boolean is_nullable
    boolean is_primary_key
    boolean is_partition_key
    string description
    boolean is_sensitive
  }
  table_stats {
    bigint id PK
    bigint table_id FK
    bigint exec_record_id FK
    bigint row_count
    bigint size_bytes
    float null_rate_avg
    float distinct_rate_avg
    timestamp stat_time
  }
  lineage_edge {
    bigint id PK
    bigint exec_record_id FK
    string src_type
    bigint src_table_id FK
    string tgt_type
    bigint tgt_table_id FK
    text field_mappings_json
    string produce_type
    timestamp recorded_at
  }
  field_lineage_edge {
    bigint id PK
    bigint lineage_edge_id FK
    bigint src_field_id FK
    bigint tgt_field_id FK
    string transform_expr
  }
  quality_rule {
    bigint id PK
    bigint table_id FK
    bigint field_id FK
    string rule_name
    string rule_type
    text rule_expr
    string threshold_op
    float threshold_val
    string alert_level
    boolean enabled
    bigint created_by FK
  }
  quality_check_result {
    bigint id PK
    bigint rule_id FK
    bigint exec_record_id FK
    float actual_val
    boolean passed
    string alert_level
    timestamp checked_at
  }
  schema_change_log {
    bigint id PK
    bigint table_id FK
    string change_type
    string old_definition
    string new_definition
    bigint detected_by_exec FK
    timestamp changed_at
  }
  catalog_table ||--o{ catalog_field : has
  catalog_table ||--o{ table_stats : tracked
  catalog_table ||--o{ quality_rule : governed
  catalog_field ||--o{ quality_rule : governed
  quality_rule ||--o{ quality_check_result : generates
  catalog_table ||--o{ lineage_edge : src
  catalog_table ||--o{ lineage_edge : tgt
  lineage_edge ||--o{ field_lineage_edge : detail
  catalog_field ||--o{ field_lineage_edge : src
  catalog_field ||--o{ field_lineage_edge : tgt
  catalog_table ||--o{ schema_change_log : tracks
`;
const {svg}=await mermaid.render('e3svg',src);
document.getElementById('e3').innerHTML=svg;
document.querySelectorAll('#e3 svg.erDiagram .node').forEach(n=>{
  const p=n.querySelector('path[d]');if(!p)return;
  const d=p.getAttribute('d'),nums=d.match(/-?[\d.]+/g)?.map(Number);
  if(!nums||nums.length<8)return;
  const xs=[nums[0],nums[2],nums[4],nums[6]],ys=[nums[1],nums[3],nums[5],nums[7]];
  const x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;
  const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
  r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);r.setAttribute('rx','8');
  for(const a of['fill','stroke','stroke-width','class','style'])if(p.hasAttribute(a))r.setAttribute(a,p.getAttribute(a));
  p.replaceWith(r);
});
document.querySelectorAll('#e3 svg.erDiagram .row-rect-odd path,#e3 svg.erDiagram .row-rect-even path').forEach(p=>p.setAttribute('stroke','none'));
</script>
