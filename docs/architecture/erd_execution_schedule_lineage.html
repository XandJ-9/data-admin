
<style>
#erd2 { overflow-x: auto; }
#erd2 svg { max-width: 100%; }
#erd2 svg.erDiagram .divider path { stroke-opacity: 0.4; }
#erd2 svg.erDiagram .row-rect-odd path,
#erd2 svg.erDiagram .row-rect-odd rect,
#erd2 svg.erDiagram .row-rect-even path,
#erd2 svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd2"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#063d2e' : '#E1F5EE',
    primaryBorderColor: dark ? '#1D9E75' : '#0F6E56',
    primaryTextColor: dark ? '#9FE1CB' : '#085041',
    secondaryColor: dark ? '#2a2870' : '#EEEDFE',
    tertiaryColor: dark ? '#1a1a18' : '#F1EFE8',
  },
});
const diagram = `erDiagram
  execution_record {
    bigint id PK
    bigint script_id FK
    bigint version_id FK
    bigint trigger_job_id FK
    string trigger_type
    string engine
    string status
    text params_json
    text result_summary
    int rows_affected
    bigint scan_bytes
    int duration_ms
    bigint executed_by FK
    timestamp started_at
    timestamp finished_at
  }
  schedule_job {
    bigint id PK
    bigint script_id FK
    string cron_expr
    string timezone
    boolean enabled
    int retry_max
    int retry_interval_s
    string backfill_strategy
    timestamp next_run_at
    bigint created_by FK
  }
  dag_definition {
    bigint id PK
    string name
    text dag_json
    string status
    bigint created_by FK
    timestamp created_at
  }
  dag_task {
    bigint id PK
    bigint dag_id FK
    bigint script_id FK
    string upstream_task_ids
    int timeout_s
    int retry_max
  }
  dag_run {
    bigint id PK
    bigint dag_id FK
    string trigger_type
    string status
    timestamp started_at
    timestamp finished_at
  }
  dag_task_run {
    bigint id PK
    bigint dag_run_id FK
    bigint dag_task_id FK
    bigint exec_record_id FK
    string status
    int attempt_no
  }
  lineage_edge {
    bigint id PK
    bigint exec_record_id FK
    string src_type
    string src_name
    string tgt_type
    string tgt_name
    string field_mappings
    timestamp recorded_at
  }

  schedule_job ||--o{ execution_record : "triggers"
  dag_definition ||--o{ dag_task : "contains"
  dag_definition ||--o{ dag_run : "instantiates"
  dag_run ||--o{ dag_task_run : "has task runs"
  dag_task_run ||--|| execution_record : "produces"
  dag_task }o--|| script_version : "pins version"
  execution_record ||--o{ lineage_edge : "generates"
`;
const { svg } = await mermaid.render('erd2-svg', diagram);
document.getElementById('erd2').innerHTML = svg;
document.querySelectorAll('#erd2 svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd2 svg.erDiagram .row-rect-odd path, #erd2 svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
